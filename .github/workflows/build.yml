name: Windows build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    # Requires VS 2026 C++ tools, Bazelisk, Git Bash and Slint 1.18.1
    # installed at the path pinned in MODULE.bazel.
    runs-on: [self-hosted, Windows, X64, oryn-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bazel build //src/app:oryn
      - name: Unit test
        run: bazel test //src/core:app_info_test //src/platform:window_test //src/platform:paths_test //src/platform:credentials_test //src/infrastructure/database:database_test //src/features/settings:settings_test //src/features/calendar:calendar_test //src/features/time:time_test //ui:time_smoke_test //ui:calendar_smoke_test --test_output=errors

  asan:
    # The same provisioned SDK/toolchain is required; hosted runners do not
    # contain the machine-local Slint repository pinned in MODULE.bazel.
    runs-on: [self-hosted, Windows, X64, oryn-build]
    steps:
      - uses: actions/checkout@v4
      - name: MSVC AddressSanitizer build and tests
        shell: cmd
        run: |
          set "ORYN_VS="
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -version "[18.0,19.0)" -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 Microsoft.VisualStudio.Component.VC.ASAN -property installationPath`) do set "ORYN_VS=%%i"
          if not defined ORYN_VS (
            echo Install VS 2026 MSVC 14.51 x64 tools and C++ AddressSanitizer.
            exit /b 1
          )
          set "BAZEL_VC=%ORYN_VS%\VC"
          call "%ORYN_VS%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.51
          if errorlevel 1 exit /b 1
          if not exist "%VCToolsInstallDir%bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll" (
            echo Install the AddressSanitizer component matching MSVC 14.51.
            exit /b 1
          )
          rem Tests inherit this PATH through test:asan in .bazelrc.
          set "PATH=%VCToolsInstallDir%bin\Hostx64\x64;C:\Program Files\Slint-cpp 1.18.1\lib;%PATH%"
          bazel build --config=asan //src/app:oryn
          if errorlevel 1 exit /b 1
          bazel test --config=asan --nocache_test_results //src/core:app_info_test //src/platform:window_test //src/platform:paths_test //src/platform:credentials_test //src/infrastructure/database:database_test //src/features/settings:settings_test //src/features/calendar:calendar_test //src/features/time:time_test //ui:time_smoke_test //ui:calendar_smoke_test --test_output=errors
          if errorlevel 1 exit /b 1
